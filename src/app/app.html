<div class="shell">
  <nav ui-nav-rail>
    @for (item of primary; track item.label) {
      <button ui-nav-rail-item type="button" [label]="item.label" [active]="active() === item.label">
        <ui-icon uiNavRailIcon [name]="item.icon" [size]="24" />
      </button>
    }
    @for (item of listings; track item.label) {
      <button ui-nav-rail-item type="button" [label]="item.label" [active]="active() === item.label">
        <ui-icon uiNavRailIcon [name]="item.icon" [size]="24" />
      </button>
    }
    @for (item of utility; track item.label) {
      <button ui-nav-rail-item type="button" [label]="item.label" [active]="active() === item.label">
        <ui-icon uiNavRailIcon [name]="item.icon" [size]="24" />
      </button>
    }
  </nav>

  <main class="shell-main">
    <router-outlet />
  </main>
</div>
