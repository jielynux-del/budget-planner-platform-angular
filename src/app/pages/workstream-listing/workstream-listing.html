<ui-page-header title="Workstream Listing">
  <button uiPageHeaderActions ui-button variant="secondary" size="small" type="button">
    <ui-icon name="download" />
    Export
  </button>
</ui-page-header>

<div class="page-content">
  <div class="filters">
    <ui-select [options]="locationOptions" [(value)]="location" [emptyValue]="locationOptions[0]" />
    <ui-select [options]="techUnitOptions" [(value)]="techUnit" [emptyValue]="techUnitOptions[0]" />
    <ui-select [options]="platformOptions" [(value)]="platform" [emptyValue]="platformOptions[0]" [searchable]="true" />
  </div>

  <div class="summaries">
    <ui-summary-card title="Locations" [items]="locationItems()" />
    <ui-summary-card title="Work Status" [items]="statusItems()" />
  </div>

  <ui-table-card>
    <ui-table-header [title]="filtered().length + ' Workstreams'">
      <ui-search-input [(value)]="search" placeholder="Search by Workstream Name" />
    </ui-table-header>

    <table ui-table size="sm">
      <thead>
        <tr>
          <th style="width: 20%"><ui-column-header label="Workstream Name" [first]="true" /></th>
          <th style="width: 14%"><ui-column-header label="Portfolio Name" /></th>
          <th style="width: 14%"><ui-column-header label="Platform" /></th>
          <th style="width: 10%"><ui-column-header label="Sub Platform" /></th>
          <th style="width: 10%"><ui-column-header label="Reporting Location" /></th>
          <th style="width: 12%"><ui-column-header label="Workstream Ref" /></th>
          <th style="width: 8%"><ui-column-header label="Start Date" /></th>
          <th style="width: 8%"><ui-column-header label="Go Live Date" /></th>
          <th style="width: 14%">
            <ui-column-header label="Work Status">
              <ui-select [options]="statusOptions" [(value)]="status" [emptyValue]="allStatus" />
            </ui-column-header>
          </th>
          <th style="width: 56px"><ui-column-header variant="blank" [last]="true" /></th>
        </tr>
      </thead>
      <tbody>
        @for (row of rows(); track row.id) {
          <tr ui-table-row interactive (activate)="open(row.id)">
            <td>
              <div class="cell-name">{{ row.name }}</div>
              <div class="cell-code">{{ row.code }}</div>
            </td>
            <td>
              <div class="cell-name">{{ row.portfolioName }}</div>
              <div class="cell-code">{{ row.portfolioCode }}</div>
            </td>
            <td>{{ row.platform }}</td>
            <td>{{ row.subPlatform }}</td>
            <td>{{ row.reportingLocation }}</td>
            <td>{{ row.workstreamRef }}</td>
            <td>{{ row.startDate }}</td>
            <td>{{ row.goLiveDate }}</td>
            <td class="ui-cell-status"><ui-status-tag [status]="row.workStatus" [variant]="variantFor(row.workStatus)" /></td>
            <td class="ui-cell-actions">
              <button ui-icon-button size="tiny" type="button" aria-label="Open workstream">
                <ui-icon name="chevron-right" />
              </button>
            </td>
          </tr>
        }
      </tbody>
    </table>

    <ui-pagination type="basic" [total]="filtered().length" [(page)]="page" />
  </ui-table-card>
</div>
